<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donar Form</title>
</head>

<body>

    <form method="post">
        <h2>Donor Information</h2>
        <table>
            <tr>
                <td>
                    <label for="name">First Name*</label>
                </td>
                <td>
                    <input type="text" id="name" name="name">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="name">Last Name*</label>
                </td>
                <td>
                    <input type="text" id="name" name="name">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="name">Company</label>
                </td>
                <td>
                    <input type="text" id="name" name="name">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="name">Address 1*</label>
                </td>
                <td>
                    <input type="text" id="name" name="name">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="name">Address 2</label>
                </td>
                <td>
                    <input type="text" id="name" name="name">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="name">City*</label>
                </td>
                <td>
                    <input type="text" id="name" name="name">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="name">State*</label>
                </td>
                <td>
                    <select id="State" name="State">
                        <option>Select a State</option>
                        <option>Abu Dhabi</option>
                        <option>Chittagong</option>
                        <option>Dhaka</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="num">Zip Code*</label>
                </td>
                <td>
                    <input type="number" id="num" name="num">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="name">Country*</label>
                </td>
                <td>
                    <select id="Country" name="Country">
                        <option>Select a Country</option>
                        <option>Algeria</option>
                        <option>Egypt</option>
                        <option>Spain</option>
                    </select>

                </td>
            </tr>
            <tr>
                <td>
                    <label for="tel">Phone*</label>
                </td>
                <td>
                    <input type="tel" id="tel" name="tel">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="tel">Fax</label>
                </td>
                <td>
                    <input type="tel" id="tel" name="tel">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="email">Email*</label>
                </td>
                <td>
                    <input type="email" id="email" name="email">
                </td>
            </tr>
            <tr>
                <td>
                    <label>Donation Amount </label>
                    <p>(Check a button or type in your amount)</p>
                </td>
                <td>
                    <input type="radio" name="Amount" value="none">None
                    <input type="radio" name="Amount" value="50">$50
                    <input type="radio" name="Amount" value="75">$75
                    <input type="radio" name="Amount" value="100">$100
                    <input type="radio" name="Amount" value="250">$250
                    <input type="radio" name="Amount" value="other">Other
                </td>
                <td></td>
                <td>
                    <label for="msg">Other Amount $</label>
                    <textarea id="msg" rows="1" cols="7"></textarea>
                </td>
            </tr>
            <tr>
                <td>
                    <label> Recurring Donation</label>
                    <p>(Check if yes)</p>
                </td>
                <td>
                    <input type="checkbox" value="yes"> I am intrested in giving on a regular basis.
                </td>


            </tr>
            <tr>
                <td></td>
                <td>
                    <label for="msg">Monthly Credit Card $</label>
                    <textarea id="msg" rows="1" cols="5"></textarea>For
                    <textarea id="msg" rows="1" cols="5"></textarea>Months
                </td>
            </tr>



        </table>

    </form>
</body>

</html>
